<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f8; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #0d1b2a; margin: 0; }
    button.logout { background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; }
    .booking-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; }
    .info b { display: block; font-size: 16px; }
    .info span { font-size: 13px; color: #666; display: block; }
    .info .time { color: #0d1b2a; font-weight: bold; margin-top: 4px; }
    .delete-btn { background: #f3f4f6; border: none; color: #dc2626; padding: 8px 12px; border-radius: 6px; }
    #loading { text-align: center; color: #666; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>الحجوزات</h2>
    <button class="logout" id="logoutBtn">تسجيل خروج</button>
  </div>
  <div id="loading">جاري التحميل...</div>
  <div id="bookingsList"></div>

  <script>
    const SUPABASE_URL = "https://ynqnyuidxpjfcvcgexoi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucW55dWlkeHBqZmN2Y2dleG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTUyMDAsImV4cCI6MjEwNTkzMTIwMH0.SRsgeU3_JSm-INcEYC-p5OzbwVoxZHWHFzaZnwa5UjY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const listEl = document.getElementById('bookingsList');
    const loadingEl = document.getElementById('loading');

    async function checkAuthAndLoad() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }
      loadBookings();
    }

    async function loadBookings() {
      const { data, error } = await supabaseClient
        .from('bookings')
        .select('*')
        .order('created_at', { ascending: false });

      loadingEl.style.display = "none";

      if (error) {
        listEl.innerHTML = "<p>حصل خطأ في تحميل الحجوزات</p>";
        return;
      }

      if (data.length === 0) {
        listEl.innerHTML = "<p>مفيش حجوزات لسه</p>";
        return;
      }

      listEl.innerHTML = data.map(b => {
        const d = new Date(b.created_at);
        const dateStr = d.toLocaleDateString('ar-EG');
        const timeStr = d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        return `
        <div class="booking-card">
          <div class="info">
            <b>${b.name}</b>
            <span>${b.phone}</span>
            <span class="time">${dateStr} - ${timeStr}</span>
          </div>
          <button class="delete-btn" onclick="deleteBooking(${b.id})">حذف</button>
        </div>
      `;
      }).join('');
    }

    async function deleteBooking(id) {
      if (!confirm("متأكد إنك عايز تحذف الحجز ده؟")) return;
      await supabaseClient.from('bookings').delete().eq('id', id);
      loadBookings();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    checkAuthAndLoad();
  </script>
</body>
</html>
