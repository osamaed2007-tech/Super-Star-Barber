<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صندوق الرسائل - Super Star</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f8; padding: 16px; color: #222; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .top h2 { margin: 0; color: #0d1b2a; font-size: 19px; }
    .top a { color: #0d1b2a; text-decoration: none; font-size: 15px; }
    #diag { display: none; background: #fee2e2; color: #991b1b; border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; word-break: break-word; }
    #loading { text-align: center; color: #666; margin-top: 40px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; color: #0d1b2a; }
    .bar button { background: #0d1b2a; color: white; border: none; border-radius: 8px; padding: 8px 12px; font-family: inherit; font-size: 13px; }
    .msg { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); border-right: 4px solid #d1d5db; }
    .msg.unread { border-right-color: #0d1b2a; background: #eef2ff; }
    .msg .head { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 8px; }
    .msg .head b { color: #0d1b2a; font-size: 15px; }
    .msg .body { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .acts { display: flex; gap: 8px; margin-top: 10px; }
    .acts button { border: none; border-radius: 6px; padding: 8px 14px; font-family: inherit; font-size: 13px; }
    .done { background: #16a34a; color: white; }
    .del { background: #f3f4f6; }
    .empty { text-align: center; color: #888; padding: 40px 0; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0d1b2a; color: white; padding: 10px 18px; border-radius: 20px; font-size: 14px; display: none; }
  </style>
  <script>
    function showError(msg) {
      var d = document.getElementById('diag');
      if (!d) return;
      d.style.display = 'block';
      d.textContent = msg;
    }
    window.addEventListener('error', function (e) { showError('خطأ في الصفحة: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showError('خطأ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="top">
    <a href="engineer-dashboard.html">→ رجوع للوحة</a>
    <h2>📥 صندوق الرسائل</h2>
  </div>

  <div id="diag"></div>
  <div id="loading">جاري التحميل...</div>

  <div id="content" style="display:none;">
    <div class="bar">
      <span id="count"></span>
      <button id="readAll">تعليم الكل "تم"</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="toast"></div>

  <script>
    const SUPABASE_URL = "https://ynqnyuidxpjfcvcgexoi.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

    const $ = (id) => document.getElementById(id);
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    let db = null;

    function toast(t) {
      const x = $('toast');
      x.textContent = t; x.style.display = 'block';
      setTimeout(() => { x.style.display = 'none'; }, 2000);
    }

    async function load() {
      const res = await db.from('messages').select('*').order('created_at', { ascending: false }).limit(100);
      if (res.error) { showError('تحميل الرسائل: ' + res.error.message + ' — شغّل كود SQL الخاص بالرسائل'); return; }
      const rows = res.data || [];
      const unread = rows.filter((m) => !m.is_read).length;
      $('count').textContent = unread > 0 ? ('غير مقروء: ' + unread) : 'كل الرسائل متقرأت';
      $('readAll').style.display = unread > 0 ? '' : 'none';

      const list = $('list');
      list.innerHTML = '';
      if (rows.length === 0) { list.appendChild(el('div', 'empty', 'مفيش رسائل لسه')); return; }

      rows.forEach((m) => {
        const card = el('div', 'msg' + (m.is_read ? '' : ' unread'));
        const head = el('div', 'head');
        head.appendChild(el('b', '', m.from_name || 'غير معروف'));
        head.appendChild(el('span', '', new Date(m.created_at).toLocaleString('ar-EG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })));
        card.appendChild(head);
        card.appendChild(el('div', 'body', m.body));
        const acts = el('div', 'acts');
        if (!m.is_read) {
          const ok = el('button', 'done', 'تم ✓');
          ok.onclick = async () => {
            const r = await db.from('messages').update({ is_read: true }).eq('id', m.id);
            if (r.error) { showError('تحديث الرسالة: ' + r.error.message); return; }
            load();
          };
          acts.appendChild(ok);
        }
        const del = el('button', 'del', '🗑️ مسح');
        del.onclick = async () => {
          if (!confirm('تمسح الرسالة دي؟')) return;
          const r = await db.from('messages').delete().eq('id', m.id);
          if (r.error) { showError('مسح الرسالة: ' + r.error.message); return; }
          toast('تم المسح'); load();
        };
        acts.appendChild(del);
        card.appendChild(acts);
        list.appendChild(card);
      });
    }

    async function init() {
      try {
        if (SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
          $('loading').style.display = 'none';
          showError('المفتاح لسه ما اتحطش في الكود (YOUR_ANON_KEY)');
          return;
        }
        db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const sess = await db.auth.getSession();
        const session = sess.data && sess.data.session;
        if (!session) { window.location.href = 'engineer-login.html'; return; }

        const st = await db.from('staff').select('role').eq('email', session.user.email.toLowerCase()).maybeSingle();
        if (st.error) { $('loading').style.display = 'none'; showError('قراءة بيانات الموظف: ' + st.error.message); return; }
        if (!st.data || st.data.role !== 'engineer') {
          $('loading').style.display = 'none';
          showError('الصفحة دي للمهندس بس');
          return;
        }

        $('readAll').onclick = async () => {
          const r = await db.from('messages').update({ is_read: true }).eq('is_read', false);
          if (r.error) { showError('تحديث الرسائل: ' + r.error.message); return; }
          load();
        };
        document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
        setInterval(load, 15000);

        await load();
        $('loading').style.display = 'none';
        $('content').style.display = 'block';
      } catch (err) {
        $('loading').style.display = 'none';
        showError('خطأ: ' + (err && err.message ? err.message : err));
      }
    }
    init();
  </script>
</body>
</html>
