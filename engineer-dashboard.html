<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة مهندس SIS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f8; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #0d1b2a; margin: 0; }
    button.logout { background: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; }

    .stats { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: white; border-radius: 10px; padding: 15px; flex: 1; min-width: 100px; text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,0.08); }
    .stat-card span { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
    .stat-card b { font-size: 24px; color: #0d1b2a; }

    .section { background: white; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); }
    .section h3 { margin-top: 0; color: #0d1b2a; font-size: 15px; }

    .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; margin-top: 15px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar { width: 100%; background: #0d1b2a; border-radius: 4px 4px 0 0; }
    .bar-label { font-size: 10px; color: #666; margin-top: 4px; }
    .bar-count { font-size: 11px; color: #0d1b2a; font-weight: bold; }

    .staff-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .staff-row:last-child { border-bottom: none; }
    .staff-row b { display: block; font-size: 14px; }
    .staff-row span { font-size: 12px; color: #666; }
    .role-tag { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #e5e7eb; color: #333; }
    .role-tag.engineer { background: #dbeafe; color: #1e3a8a; }

    form.add-staff { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    form.add-staff input, form.add-staff select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; text-align: right; }
    form.add-staff button { padding: 10px; background: #0d1b2a; color: white; border: none; border-radius: 6px; }
    .note { font-size: 11px; color: #999; margin-top: 8px; }
    #addMsg { font-size: 13px; font-weight: bold; margin-top: 6px; }
    #loading { text-align: center; color: #666; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>لوحة مهندس SIS</h2>
    <button class="logout" id="logoutBtn">تسجيل خروج</button>
  </div>

  <div id="loading">جاري التحميل...</div>

  <div id="content" style="display:none;">
    <div class="stats">
      <div class="stat-card"><span>حجوزات النهاردة</span><b id="todayCount">0</b></div>
      <div class="stat-card"><span>حجوزات الأسبوع</span><b id="weekCount">0</b></div>
      <div class="stat-card"><span>حجوزات الشهر</span><b id="monthCount">0</b></div>
    </div>

    <div class="section">
      <h3>آخر 7 أيام</h3>
      <div class="chart-bars" id="chartBars"></div>
    </div>

    <div class="section">
      <h3>الموظفين (أدمن + مهندسين)</h3>
      <div id="staffList"></div>

      <h3 style="margin-top:20px;">إضافة موظف جديد</h3>
      <form class="add-staff" id="addStaffForm">
        <input type="email" id="newEmail" placeholder="الإيميل" required>
        <input type="text" id="newName" placeholder="الاسم" required>
        <select id="newRole">
          <option value="barber">أدمن (حلاق)</option>
          <option value="engineer">مهندس SIS</option>
        </select>
        <button type="submit">إضافة</button>
      </form>
      <p id="addMsg"></p>
      <p class="note">ملحوظة: بعد الإضافة هنا، لازم تعمل حساب دخول (إيميل وباسورد) لنفس الإيميل ده من Supabase → Authentication → Add user.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ynqnyuidxpjfcvcgexoi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucW55dWlkeHBqZmN2Y2dleG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTUyMDAsImV4cCI6MjEwNTkzMTIwMH0.SRsgeU3_JSm-INcEYC-p5OzbwVoxZHWHFzaZnwa5UjY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');

    async function checkAuthAndLoad() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "index.html";
        return;
      }

      const { data: staffData } = await supabaseClient
        .from('staff')
        .select('role')
        .eq('email', session.user.email)
        .single();

      if (!staffData || staffData.role !== 'engineer') {
        window.location.href = "index.html";
        return;
      }

      await Promise.all([loadStats(), loadStaff()]);
      loadingEl.style.display = "none";
      contentEl.style.display = "block";
    }

    async function loadStats() {
      const { data: allBookings } = await supabaseClient
        .from('bookings')
        .select('created_at')
        .order('created_at', { ascending: false });

      if (!allBookings) return;

      const now = new Date();
      const startToday = new Date(); startToday.setHours(0,0,0,0);
      const startWeek = new Date(); startWeek.setDate(now.getDate() - 7);
      const startMonth = new Date(); startMonth.setDate(1); startMonth.setHours(0,0,0,0);

      const todayCount = allBookings.filter(b => new Date(b.created_at) >= startToday).length;
      const weekCount = allBookings.filter(b => new Date(b.created_at) >= startWeek).length;
      const monthCount = allBookings.filter(b => new Date(b.created_at) >= startMonth).length;

      document.getElementById('todayCount').textContent = todayCount;
      document.getElementById('weekCount').textContent = weekCount;
      document.getElementById('monthCount').textContent = monthCount;

      // آخر 7 أيام
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(now.getDate() - i);
        d.setHours(0,0,0,0);
        const nextDay = new Date(d);
        nextDay.setDate(d.getDate() + 1);
        const count = allBookings.filter(b => {
          const t = new Date(b.created_at);
          return t >= d && t < nextDay;
        }).length;
        days.push({ label: d.toLocaleDateString('ar-EG', { weekday: 'short' }), count });
      }

      const maxCount = Math.max(...days.map(d => d.count), 1);
      const chartEl = document.getElementById('chartBars');
      chartEl.innerHTML = days.map(d => `
        <div class="bar-wrap">
          <span class="bar-count">${d.count}</span>
          <div class="bar" style="height:${(d.count / maxCount) * 100}px;"></div>
          <span class="bar-label">${d.label}</span>
        </div>
      `).join('');
    }

    async function loadStaff() {
      const { data } = await supabaseClient
        .from('staff')
        .select('*')
        .order('created_at', { ascending: false });

      const listEl = document.getElementById('staffList');
      if (!data || data.length === 0) {
        listEl.innerHTML = "<p>مفيش موظفين مسجلين</p>";
        return;
      }

      listEl.innerHTML = data.map(s => `
        <div class="staff-row">
          <div>
            <b>${s.name}</b>
            <span>${s.email}</span>
          </div>
          <span class="role-tag ${s.role === 'engineer' ? 'engineer' : ''}">${s.role === 'engineer' ? 'مهندس' : 'أدمن'}</span>
        </div>
      `).join('');
    }

    document.getElementById('addStaffForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('newEmail').value.trim();
      const name = document.getElementById('newName').value.trim();
      const role = document.getElementById('newRole').value;
      const msgEl = document.getElementById('addMsg');

      const { error } = await supabaseClient
        .from('staff')
        .insert([{ email, name, role }]);

      if (error) {
        msgEl.style.color = "red";
        msgEl.textContent = "حصل خطأ، جرب تاني";
      } else {
        msgEl.style.color = "green";
        msgEl.textContent = "تمت الإضافة، متنساش تعمل حساب الدخول من Supabase";
        document.getElementById('addStaffForm').reset();
        loadStaff();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    checkAuthAndLoad();
  </script>
</body>
</html>
