<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الحلاقين - Super Star</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f8; padding: 16px; color: #222; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .top h2 { margin: 0; color: #0d1b2a; font-size: 19px; }
    .top a { color: #0d1b2a; text-decoration: none; font-size: 15px; }
    #diag { display: none; background: #fee2e2; color: #991b1b; border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; word-break: break-word; }
    #loading { text-align: center; color: #666; margin-top: 40px; }
    .note { background: #eef2ff; color: #333; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; }
    .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); }
    .card.off { opacity: 0.7; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .head b { font-size: 16px; color: #0d1b2a; }
    .badge { font-size: 12px; border-radius: 10px; padding: 3px 10px; white-space: nowrap; }
    .b-on { background: #dcfce7; color: #166534; }
    .b-off { background: #fee2e2; color: #991b1b; }
    .b-eng { background: #e0e7ff; color: #3730a3; }
    .mail { color: #777; font-size: 13px; margin: 6px 0 10px; word-break: break-all; direction: ltr; text-align: right; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; }
    .acts button { border: none; border-radius: 6px; padding: 8px 12px; font-family: inherit; font-size: 13px; background: #f3f4f6; }
    .acts .stop { background: #fef3c7; }
    .acts .go { background: #16a34a; color: white; }
    .acts .rm { background: #fee2e2; color: #991b1b; }
    .empty { text-align: center; color: #888; padding: 40px 0; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0d1b2a; color: white; padding: 10px 18px; border-radius: 20px; font-size: 14px; display: none; }
  </style>
  <script>
    function showError(msg) {
      var d = document.getElementById('diag');
      if (!d) return;
      d.style.display = 'block';
      d.textContent = msg;
    }
    window.addEventListener('error', function (e) { showError('خطأ في الصفحة: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showError('خطأ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="top">
    <a href="engineer-dashboard.html">→ رجوع للوحة</a>
    <h2>👥 إدارة الحلاقين</h2>
  </div>

  <div id="diag"></div>
  <div id="loading">جاري التحميل...</div>

  <div id="content" style="display:none;">
    <div class="note">الموقوف مش بيعرف يدخل، وتقدر ترجّعه في أي وقت. المحذوف بيتشال من القائمة ومبيدخلش. ولو عاوز ترجعه بعد كده استخدم "إيقاف" بدل "حذف".</div>
    <div id="list"></div>
  </div>
  <div id="toast"></div>

  <script>
    const SUPABASE_URL = "https://ynqnyuidxpjfcvcgexoi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucW55dWlkeHBqZmN2Y2dleG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTUyMDAsImV4cCI6MjEwNTkzMTIwMH0.SRsgeU3_JSm-INcEYC-p5OzbwVoxZHWHFzaZnwa5UjY";

    const $ = (id) => document.getElementById(id);
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    let db = null;
    let myEmail = '';

    function toast(t) {
      const x = $('toast');
      x.textContent = t; x.style.display = 'block';
      setTimeout(() => { x.style.display = 'none'; }, 2200);
    }

    async function updateStaff(email, fields, okText) {
      const r = await db.from('staff').update(fields).eq('email', email).select();
      if (r.error) { showError('تعديل الحلاق: ' + r.error.message + ' — شغّل كود SQL الخاص بالحلاقين'); return; }
      if (!r.data || r.data.length === 0) { showError('ما اتعدلش، غالبًا كود SQL الخاص بالحلاقين لسه ما اتشغلش'); return; }
      $('diag').style.display = 'none';
      toast(okText);
      load();
    }

    async function removeStaff(email, name) {
      if (!confirm('تشيل "' + name + '" من القائمة؟ مش هيقدر يدخل بعد كده.')) return;
      const r = await db.from('staff').delete().eq('email', email).select();
      if (r.error) { showError('حذف الحلاق: ' + r.error.message); return; }
      if (!r.data || r.data.length === 0) { showError('ما اتمسحش، غالبًا كود SQL الخاص بالحلاقين لسه ما اتشغلش'); return; }
      toast('تم الحذف');
      load();
    }

    async function load() {
      const res = await db.from('staff').select('email,name,role').order('name', { ascending: true });
      if (res.error) { showError('تحميل الحلاقين: ' + res.error.message); return; }
      const rows = res.data || [];
      const list = $('list');
      list.innerHTML = '';
      if (rows.length === 0) { list.appendChild(el('div', 'empty', 'مفيش حلاقين')); return; }

      rows.forEach((s) => {
        const off = s.role === 'suspended';
        const isEng = s.role === 'engineer';
        const card = el('div', 'card' + (off ? ' off' : ''));

        const head = el('div', 'head');
        head.appendChild(el('b', '', s.name || '(بدون اسم)'));
        head.appendChild(el('span', 'badge ' + (isEng ? 'b-eng' : off ? 'b-off' : 'b-on'),
          isEng ? 'مهندس' : off ? 'موقوف' : 'شغال'));
        card.appendChild(head);
        card.appendChild(el('div', 'mail', s.email));

        if (!isEng) {
          const acts = el('div', 'acts');

          const ren = el('button', '', '✏️ تغيير الاسم');
          ren.onclick = () => {
            const n = prompt('الاسم الجديد:', s.name || '');
            if (n === null) return;
            const v = n.trim();
            if (!v) { alert('الاسم فاضي'); return; }
            updateStaff(s.email, { name: v }, 'تم تغيير الاسم');
          };
          acts.appendChild(ren);

          if (off) {
            const go = el('button', 'go', '▶️ تفعيل');
            go.onclick = () => updateStaff(s.email, { role: 'barber' }, 'تم التفعيل');
            acts.appendChild(go);
          } else {
            const stop = el('button', 'stop', '⏸ إيقاف');
            stop.onclick = () => {
              if (confirm('توقف "' + s.name + '"؟ مش هيقدر يدخل لحد ما تفعّله.')) updateStaff(s.email, { role: 'suspended' }, 'تم الإيقاف');
            };
            acts.appendChild(stop);
          }

          const rm = el('button', 'rm', '🗑️ حذف');
          rm.onclick = () => removeStaff(s.email, s.name);
          acts.appendChild(rm);

          card.appendChild(acts);
        }
        list.appendChild(card);
      });
    }

    async function init() {
      try {
        if (SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
          $('loading').style.display = 'none';
          showError('المفتاح لسه ما اتحطش في الكود (YOUR_ANON_KEY)');
          return;
        }
        db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const sess = await db.auth.getSession();
        const session = sess.data && sess.data.session;
        if (!session) { window.location.href = 'engineer-login.html'; return; }
        myEmail = session.user.email.toLowerCase();

        const st = await db.from('staff').select('role').eq('email', myEmail).maybeSingle();
        if (st.error) { $('loading').style.display = 'none'; showError('قراءة بيانات الموظف: ' + st.error.message); return; }
        if (!st.data || st.data.role !== 'engineer') {
          $('loading').style.display = 'none';
          showError('الصفحة دي للمهندس بس');
          return;
        }

        await load();
        $('loading').style.display = 'none';
        $('content').style.display = 'block';
      } catch (err) {
        $('loading').style.display = 'none';
        showError('خطأ: ' + (err && err.message ? err.message : err));
      }
    }
    init();
  </script>
</body>
</html>
