<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التواصل مع المهندس - Super Star</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f8; padding: 16px; color: #222; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .top h2 { margin: 0; color: #0d1b2a; font-size: 19px; }
    .top a { color: #0d1b2a; text-decoration: none; font-size: 15px; }
    #diag { display: none; background: #fee2e2; color: #991b1b; border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.7; word-break: break-word; }
    #loading { text-align: center; color: #666; margin-top: 40px; }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); margin-bottom: 14px; }
    .card p { margin: 0 0 10px; color: #555; font-size: 14px; line-height: 1.7; }
    textarea { width: 100%; min-height: 130px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 15px; resize: vertical; }
    .btn { display: block; width: 100%; border: none; border-radius: 8px; padding: 13px; font-size: 16px; font-family: inherit; margin-top: 10px; text-align: center; text-decoration: none; }
    .send { background: #0d1b2a; color: white; }
    .send:disabled { opacity: 0.5; }
    .wa { background: #25d366; color: white; }
    #ok { display: none; background: #dcfce7; color: #166534; border-radius: 10px; padding: 12px; margin-bottom: 14px; text-align: center; font-size: 14px; }
  </style>
  <script>
    function showError(msg) {
      var d = document.getElementById('diag');
      if (!d) return;
      d.style.display = 'block';
      d.textContent = msg;
    }
    window.addEventListener('error', function (e) { showError('خطأ في الصفحة: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showError('خطأ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="top">
    <a href="admin.html">→ رجوع للوحة</a>
    <h2>💬 التواصل مع المهندس</h2>
  </div>

  <div id="diag"></div>
  <div id="loading">جاري التحميل...</div>

  <div id="content" style="display:none;">
    <div id="ok">✅ وصلت رسالتك للمهندس</div>

    <div class="card">
      <p>اكتب مشكلتك أو طلبك، وهتوصل للمهندس في لوحته.</p>
      <textarea id="msg" maxlength="1000" placeholder="اكتب رسالتك هنا..."></textarea>
      <button class="btn send" id="sendBtn">إرسال الرسالة</button>
    </div>

    <div class="card">
      <p>لو الموضوع مستعجل، كلمه على واتساب مباشرة:</p>
      <a class="btn wa" id="waBtn" target="_blank" rel="noopener">فتح واتساب</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ynqnyuidxpjfcvcgexoi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucW55dWlkeHBqZmN2Y2dleG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTUyMDAsImV4cCI6MjEwNTkzMTIwMH0.SRsgeU3_JSm-INcEYC-p5OzbwVoxZHWHFzaZnwa5UjY";
    const ENGINEER_WHATSAPP = "201000517728";

    const $ = (id) => document.getElementById(id);
    let db = null, myName = '', myEmail = '';

    async function send() {
      const body = $('msg').value.trim();
      if (!body) { alert('اكتب الرسالة الأول'); return; }
      const btn = $('sendBtn');
      btn.disabled = true;
      const res = await db.from('messages').insert([{ from_name: myName, from_email: myEmail, body: body }]);
      btn.disabled = false;
      if (res.error) { showError('إرسال الرسالة: ' + res.error.message + ' — شغّل كود SQL الخاص بالرسائل'); return; }
      $('msg').value = '';
      $('diag').style.display = 'none';
      $('ok').style.display = 'block';
      setTimeout(() => { $('ok').style.display = 'none'; }, 4000);
    }

    async function init() {
      try {
        if (SUPABASE_ANON_KEY.indexOf('YOUR_') === 0) {
          $('loading').style.display = 'none';
          showError('المفتاح لسه ما اتحطش في الكود (YOUR_ANON_KEY)');
          return;
        }
        db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const sess = await db.auth.getSession();
        const session = sess.data && sess.data.session;
        if (!session) { window.location.href = 'barber-login.html'; return; }

        myEmail = session.user.email.toLowerCase();
        const st = await db.from('staff').select('name').eq('email', myEmail).maybeSingle();
        if (st.error) { $('loading').style.display = 'none'; showError('قراءة بيانات الموظف: ' + st.error.message); return; }
        if (!st.data) { $('loading').style.display = 'none'; showError('الإيميل ' + myEmail + ' مش مسجل في جدول staff'); return; }
        myName = st.data.name;

        $('sendBtn').onclick = send;
        const text = 'أنا ' + myName + ' من Super Star، محتاج مساعدة:';
        $('waBtn').href = 'https://wa.me/' + ENGINEER_WHATSAPP + '?text=' + encodeURIComponent(text);

        $('loading').style.display = 'none';
        $('content').style.display = 'block';
      } catch (err) {
        $('loading').style.display = 'none';
        showError('خطأ: ' + (err && err.message ? err.message : err));
      }
    }
    init();
  </script>
</body>
</html>
