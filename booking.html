<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد - Super Star</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: flex-start; padding-top: 60px; }
    .card { background: white; width: 320px; padding: 30px 25px; border-radius: 12px; text-align: center; }
    .icon { width: 60px; height: 60px; background: #2563eb; border-radius: 14px; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; font-size: 28px; }
    h2 { color: #111; margin-bottom: 5px; }
    p { color: #666; font-size: 13px; margin-bottom: 20px; }
    label { display: block; text-align: right; margin-bottom: 5px; font-size: 14px; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: right; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; }
    button:disabled { background: #93c5fd; }
    a { display: block; margin-top: 12px; font-size: 13px; color: #2563eb; text-decoration: none; }
    #message { margin-top: 15px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💈</div>
    <h2>Super Star</h2>
    <p>احجز موعدك دلوقتي</p>
    <form id="bookingForm">
      <label>الاسم:</label>
      <input type="text" id="name" placeholder="اكتب اسمك" required>
      <label>رقم التليفون:</label>
      <input type="tel" id="phone" placeholder="01xxxxxxxxx" required>
      <button type="submit" id="submitBtn">تأكيد الحجز</button>
    </form>
    <p id="message"></p>
    <a href="index.html">تسجيل دخول الأدمن</a>
  </div>

  <script>
    const SUPABASE_URL = "https://ynqnyuidxpjfcvcgexoi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucW55dWlkeHBqZmN2Y2dleG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTUyMDAsImV4cCI6MjEwNTkzMTIwMH0.SRsgeU3_JSm-INcEYC-p5OzbwVoxZHWHFzaZnwa5UjY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('bookingForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function generateCode(phone, dateObj) {
      const last4 = phone.slice(-4);
      const day = String(dateObj.getDate()).padStart(2, '0');
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const hours = String(dateObj.getHours()).padStart(2, '0');
      const minutes = String(dateObj.getMinutes()).padStart(2, '0');
      return `SS-${last4}-${day}${month}-${hours}${minutes}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const now = new Date();
      const code = generateCode(phone, now);

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري الحجز...";
      messageEl.textContent = "";

      const { error } = await supabaseClient
        .from('bookings')
        .insert([{ name: name, phone: phone, code: code }]);

      if (error) {
        messageEl.style.color = "red";
        messageEl.textContent = "حصل خطأ، حاول تاني";
        submitBtn.disabled = false;
        submitBtn.textContent = "تأكيد الحجز";
      } else {
        const dateStr = now.toLocaleDateString('ar-EG');
        const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const params = new URLSearchParams({
          code: code,
          name: name,
          phone: phone,
          date: dateStr,
          time: timeStr
        });
        window.location.href = `confirmation.html?${params.toString()}`;
      }
    });
  </script>
</body>
</html>
