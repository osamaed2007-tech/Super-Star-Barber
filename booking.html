<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد - Super Star</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 60px;
    }
    .card {
      background: white;
      width: 320px;
      padding: 30px 25px;
      border-radius: 12px;
      text-align: center;
    }
    .icon {
      width: 60px;
      height: 60px;
      background: #2563eb;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px;
      font-size: 28px;
    }
    h2 {
      color: #111;
      margin-bottom: 5px;
    }
    p {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      text-align: right;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      text-align: right;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    a {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💈</div>
    <h2>Super Star</h2>
    <p>احجز موعدك دلوقتي</p>
    <form>
      <label>الاسم:</label>
      <input type="text" placeholder="اكتب اسمك">
      <label>رقم التليفون:</label>
      <input type="tel" placeholder="01xxxxxxxxx">
      <button type="submit">تأكيد الحجز</button>
    </form>
    <a href="index.html">تسجيل دخول الأدمن</a>
  </div>
</body>
</html>
